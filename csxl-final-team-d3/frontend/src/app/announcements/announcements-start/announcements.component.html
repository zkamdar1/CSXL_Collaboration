<div>
  <div class="parameter-bar">
    <search-bar class="search-bar"></search-bar>
  </div>

  <div class="container">
    <div class="events-grid">
      <div class="events-column">
        <!-- Date Range Navigation -->
        <mat-card class="date-range" appearance="outlined">
          <button mat-icon-button (click)="scrollLeft()">
            <mat-icon>keyboard_arrow_left</mat-icon>
          </button>
          <p *ngIf="viewingDate" class="date-display">
            {{ viewingDate | date: 'fullDate' }}
          </p>
          <button mat-icon-button (click)="scrollRight()">
            <mat-icon>keyboard_arrow_right</mat-icon>
          </button>
        </mat-card>

        <!-- Carousel Container -->
        <div class="carousel-container" #carousel>
          <div class="carousel-track">
            <div
              *ngFor="let announcement of visibleAnnouncements"
              class="announcement-card">
              <announcement-card
                [announcement]="announcement"></announcement-card>
            </div>
          </div>
        </div>

        <div class="details-column">
          <announcement-detail-card
            [announcement]="selectedAnnouncement"
            *ngIf="selectedAnnouncement"></announcement-detail-card>
        </div>
      </div>

      <div class="button-column">
        <button routerLink="/coworking">Go to Cowork Page</button>
        <button
          *ngIf="adminPermission$ | async"
          (click)="navigateToCreationForm()">
          Create Announcement
        </button>
      </div>
    </div>
  </div>
</div>
